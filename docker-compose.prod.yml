services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Uses default CMD (gunicorn) from Dockerfile
    # NO volume mount for ./src (Code is baked into image)
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # New Nginx Service
  proxy:
    build:
      context: ./proxy
    ports:
      - "80:80"  # Expose standard web port (Add 443 here if using SSL certs)
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod # Use secure passwords
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Port 5432 REMOVED for security (Internal only)

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
