services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  proxy:
    build:
      context: ./proxy
    ports:
      - "80:80"   # HTTP (for redirect)
      - "7749:443" # HTTPS (SSL)
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      # MOUNT CERTIFICATES HERE:
      # Format: ./path_on_host:/path_in_container:ro (read-only)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
