<header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 sticky top-0 z-10">
    <h1 class="text-xl font-bold text-gray-700">
        {% block header %}{% endblock %}
    </h1>

    <div class="flex items-center space-x-4">
        {% if user.is_authenticated %}
                <span class="mr-4 text-sm text-gray-600">
                    Signed in as <strong>{{ user.username }}</strong>
                </span>

                <form action="{% url 'core:logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2 focus:outline-none">
                        Logout
                    </button>
                </form>
        {% endif %}
    </div>
</header>
