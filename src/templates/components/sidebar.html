<aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex h-full">
    <div class="h-16 flex items-center justify-center border-b border-slate-800">
        <span class="text-xl font-bold tracking-wider text-blue-400">Supply/Demand</span>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2">
        <a href="{% url 'core:home' %}"
            class="ajax-link flex items-center px-4 py-3 rounded-lg transition-colors
            {% if request.resolver_match.url_name == 'home' %}bg-blue-600 text-white shadow-lg{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            Dashboard
        </a>

        <div class="space-y-1">
            <p class="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider mt-4 mb-2">
                Inventory
            </p>

            <a href="{% url 'inventory:inventory_list_by_nature' 'RAW' %}"
                class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
                {% if current_nature == 'RAW' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Raw Materials
            </a>

            <a href="{% url 'inventory:inventory_list_by_nature' 'PKG' %}"
                class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
                {% if current_nature == 'PKG' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                Packaging & Labels
            </a>

            <a href="{% url 'inventory:inventory_list_by_nature' 'FG' %}"
                class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
                {% if current_nature == 'FG' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                Finished Goods
            </a>
        </div>

        <div class="space-y-1 mt-4">
            <p class="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                Manufacturing
            </p>

            <a href="{% url 'production:dashboard' %}"
            class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.resolver_match.url_name == 'dashboard' and request.resolver_match.app_name == 'production' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                Production List
            </a>

            <a href="{% url 'production:calendar_view' %}"
            class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.resolver_match.url_name == 'calendar_view' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Schedule (Calendar)
            </a>
        </div>

        <div class="space-y-1 mt-4">
            <p class="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                Forecast
            </p>

            <a href="{% url 'forecast:dashboard' %}"
               class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
               {% if request.resolver_match.url_name == 'dashboard' and request.resolver_match.app_name == 'forecast' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                Forecast Dashboard
            </a>

            <a href="{% url 'forecast:sales_forecast' %}"
               class="ajax-link flex items-center px-4 py-2 text-sm rounded-lg transition-colors
               {% if request.resolver_match.url_name == 'sales_forecast' %}bg-blue-600 text-white{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                Sales Forecast
            </a>
        </div>
    </nav>

    <div class="p-4 border-t border-slate-800">
        <a href="{% url 'core:resume' %}"
            class="ajax-link flex items-center px-4 py-3 rounded-lg transition-colors group
            {% if request.resolver_match.url_name == 'resume' %}bg-blue-600 text-white shadow-lg{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">

            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0
                {% if request.resolver_match.url_name == 'resume' %}bg-white text-blue-600{% else %}bg-blue-500 text-white group-hover:bg-blue-400{% endif %}">
                K
            </div>

            <div class="ml-3">
                <p class="text-sm font-medium {% if request.resolver_match.url_name == 'resume' %}text-white{% else %}text-slate-300 group-hover:text-blue-400{% endif %}">
                    Chloe Koo Portfolio
                </p>
                <p class="text-xs {% if request.resolver_match.url_name == 'resume' %}text-blue-100{% else %}text-slate-500{% endif %}">
                    Planner
                </p>
            </div>
        </a>
    </div>
</aside>
