<div id="allocationModal" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-sm">

                <form method="POST" id="allocationForm">
                    {% csrf_token %}
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                                <i class="bi bi-layers text-blue-600 text-lg"></i>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                                <h3 class="text-base font-semibold leading-6 text-gray-900" id="alloc-modal-title">Allocate Stock</h3>
                                <div class="mt-2">
                                    <div class="mb-3">
                                        <p class="text-sm text-gray-500">
                                            for <span id="allocSku" class="font-bold text-gray-800"></span>.
                                        </p>
                                        <p id="allocDesc" class="text-md text-gray-500 mt-1"></p>
                                    </div>

                                    <div class="mb-4 bg-blue-50 border border-blue-100 rounded-md p-3">
                                        <div class="flex justify-between items-center">
                                            <span class="text-xs text-blue-700 font-medium">Projected Available:</span>
                                            <span id="allocAvailable" class="text-sm font-bold text-blue-800">0</span>
                                        </div>
                                        <p class="text-[10px] text-blue-500 mt-1">
                                            (On Hand - Reserved)
                                        </p>
                                    </div>

                                    <div class="space-y-3">
                                        <div>
                                            <label class="block text-xs font-medium text-gray-700">Customer Demand</label>
                                            <input type="text" id="allocDemandQty" disabled class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 text-gray-500 sm:text-sm border p-2">
                                        </div>

                                        <div>
                                            <label class="block text-xs font-medium text-gray-700">Assign to Shipment (Optional)</label>
                                            <select name="shipment_id" id="allocShipmentId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2">
                                                <option value="">-- Unassigned --</option>
                                                {% for ship in active_shipments %}
                                                <option value="{{ ship.id }}">
                                                    {{ ship.reference }}
                                                    {% if ship.destination %}[{{ ship.destination }}]{% endif %}
                                                    ({{ ship.etd|date:"M d" }})
                                                </option>
                                                {% endfor %}
                                            </select>
                                            <p class="text-[10px] text-gray-400 mt-1">
                                                Go to Dashboard to create new shipments.
                                            </p>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-medium text-gray-700">Allocate Quantity</label>
                                            <input type="number" step="1" name="allocate_qty" id="allocInputQty" required
                                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2">
                                            <p class="text-xs text-gray-400 mt-1">Enter 0 to release allocation.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" class="inline-flex w-full justify-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:ml-3 sm:w-auto">Confirm</button>
                        <button type="button" onclick="window.closeAllocModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Cancel</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
