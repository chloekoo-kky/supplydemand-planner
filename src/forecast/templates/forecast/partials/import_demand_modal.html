<div id="importDemandModal" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">

            <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="import_demand" value="1">

                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4 border-b border-gray-100">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold leading-6 text-gray-900" id="modal-title">
                                <i class="bi bi-file-earmark-spreadsheet mr-2 text-blue-600"></i>Import Market Demand
                            </h3>
                            <button type="button" onclick="closeDemandModal()" class="text-gray-400 hover:text-gray-500">
                                <span class="sr-only">Close</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="px-4 py-5 sm:p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium leading-6 text-gray-900">1. Select Country / Region</label>
                            <div class="mt-1">
                                <input type="text" name="country" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-2" placeholder="e.g. Malaysia, Global..." required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium leading-6 text-gray-900">2. Data Type</label>
                            <div class="mt-1">
                                <select name="demand_type" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-2">
                                    <option value="FORECAST" selected>Sales Forecast (For Planning)</option>
                                    <option value="ACTUAL">Actual Sales History (For Analysis)</option>
                                </select>
                            </div>
                            <p class="mt-1 text-xs text-gray-500">Choose 'Forecast' to drive the MRP engine.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium leading-6 text-gray-900">3. Upload File</label>
                            <div class="mt-1">
                                <input type="file" name="file" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-500
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded-full file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-blue-50 file:text-blue-700
                                  hover:file:bg-blue-100" required>
                            </div>
                            <div class="mt-2 rounded-md bg-blue-50 p-3 text-sm text-blue-700 border border-blue-200">
                                <strong>Format Guide:</strong><br>
                                Columns: <code>SKU</code>, <code>2026-01-01</code>, <code>2026-02-01</code>...<br>
                                (Using the Wide Format sample generated previously)
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" class="inline-flex w-full justify-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:ml-3 sm:w-auto">Import Data</button>
                        <button type="button" onclick="closeDemandModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Attach functions to 'window' to make them globally accessible
    // even after AJAX page loads.
    window.openDemandModal = function() {
        const modal = document.getElementById('importDemandModal');
        if (modal) {
            modal.classList.remove('hidden');
        } else {
            console.error("Modal element 'importDemandModal' not found!");
        }
    }

    window.closeDemandModal = function() {
        const modal = document.getElementById('importDemandModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }
</script>
