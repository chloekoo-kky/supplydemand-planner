<div id="runMrpModal" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">

            <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="run_mrp" value="1">

                    <div class="bg-green-50 px-4 pb-4 pt-5 sm:p-6 sm:pb-4 border-b border-green-100">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold leading-6 text-green-900" id="modal-title">
                                <i class="bi bi-lightning-charge-fill mr-2 text-green-600"></i>Run MRP Engine
                            </h3>
                            <button type="button" onclick="closeMrpModal()" class="text-gray-400 hover:text-gray-500">
                                <span class="sr-only">Close</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="px-4 py-5 sm:p-6">
                        <p class="text-sm text-gray-500 mb-4">
                            This will calculate net requirements based on
                            <strong class="text-gray-900">Total Forecast</strong> vs <strong class="text-gray-900">Current Stock</strong> for the selected period.
                        </p>

                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col items-center justify-center">
                            <label for="mrpTargetMonth" class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-2">Target Period</label>

                            <input type="month"
                                   id="mrpTargetMonth"
                                   name="target_month"
                                   required
                                   value="{% if current_month %}{{ current_month }}{% else %}{% now 'Y-m' %}{% endif %}"
                                   class="block w-full max-w-[200px] rounded-md border-0 py-2 text-green-700 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-green-600 sm:text-lg sm:leading-6 text-center font-bold font-mono">
                        </div>
                    </div>

                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" class="inline-flex w-full justify-center rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-green-500 sm:ml-3 sm:w-auto">
                            Run Calculation
                        </button>
                        <button type="button" onclick="closeMrpModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Global functions to handle MRP Modal visibility
    window.openMrpModal = function() {
        const modal = document.getElementById('runMrpModal');
        if (modal) {
            modal.classList.remove('hidden');
        }
    }

    window.closeMrpModal = function() {
        const modal = document.getElementById('runMrpModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }
</script>
