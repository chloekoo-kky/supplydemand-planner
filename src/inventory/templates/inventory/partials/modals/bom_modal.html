<div id="bomModal"
     class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
     onmousedown="this.dataset.readyToClose = 'true'"
     onclick="if(this.dataset.readyToClose === 'true') closeBomModal(); this.dataset.readyToClose = 'false'">

    <div class="relative top-10 mx-auto p-0 border w-[600px] shadow-lg rounded-lg bg-white flex flex-col max-h-[90vh]"
         onmousedown="event.stopPropagation()"
         onclick="event.stopPropagation()">

        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-lg">
            <div>
                <h3 class="text-lg font-bold text-gray-800">Recipe Management</h3>
                <p class="text-xs text-gray-500 mt-0.5" id="bom_modal_product_label">Product SKU</p>
            </div>
            <button onclick="closeBomModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="px-6 py-4 bg-white border-b border-gray-100">
             <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Add Component</label>
             <div class="flex space-x-2 relative">
                 <div class="flex-1 relative">
                     <input type="text" id="bom_search_input"
                            class="w-full py-2 border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                            placeholder="Search Raw Material or Packaging..."
                            autocomplete="off"
                            oninput="debounceBomSearch()">

                     <div id="bom_search_results" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg z-50 max-h-60 overflow-y-auto">
                        </div>
                 </div>
                 <div class="flex items-center">
                    <input type="number" id="bom_add_qty" value="1" step="0.0001" min="0" class="w-30 py-2 px-2 border-gray-300 rounded-l-md shadow-sm text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Qty">
                    <span id="bom_add_uom" class="inline-flex items-center px-3 py-2 rounded-r-md bg-gray-50 text-gray-500 text-sm">
                        -
                    </span>
                </div>
                <button onclick="addBomComponent()" class="ml-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow-sm transition">
                    Add
                </button>
             </div>

             <div class="mt-2 text-right">
                 <button onclick="toggleBomCalculator()" class="text-xs text-blue-500 hover:text-blue-700 underline focus:outline-none">
                     Calculate from Batch
                 </button>
             </div>

             <div id="bom_calculator_panel" class="hidden mt-2 p-3 bg-blue-50 rounded-md border border-blue-100 grid grid-cols-2 gap-3 items-start transition-all">
                 <div class="col-span-2 flex items-center mb-1">
                     <input type="checkbox" id="calc_use_weight" class="rounded text-blue-600 focus:ring-blue-500 mr-2 h-4 w-4" onchange="updateCalcLabel(); runBomCalculation();">
                     <label for="calc_use_weight" class="text-xs font-bold text-gray-700 cursor-pointer select-none">
                         Calculate by Weight/Volume (Auto-convert units)
                     </label>
                 </div>

                 <div>
                     <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Batch Size (FG Qty)</label>
                     <input type="number" id="calc_batch_size" placeholder="e.g. 1000" class="w-full px-2 text-xs border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 py-1.5" oninput="runBomCalculation()">
                 </div>

                 <div>
                     <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1" id="calc_req_label">Total Component Req.</label>
                     <input type="number" id="calc_total_req" placeholder="e.g. 13" class="w-full text-xs border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 py-1.5" oninput="runBomCalculation()">
                 </div>

                 <div id="calc_intermediate_row" class="col-span-2 hidden text-right -mb-1">
                    <span class="text-[14px] text-gray-500">Weight (Per F.G.):</span>
                    <span id="calc_intermediate_val" class="text-xs font-bold text-gray-700 ml-1">0</span>
                    <span id="calc_intermediate_unit" class="text-[10px] text-gray-500">kg</span>
                 </div>

                 <div class="col-span-2 text-[14px] text-blue-600 border-t border-blue-200 pt-2 mt-1 flex justify-between items-center">
                     <span>Calculation Result (Per UOM): <span id="calc_result_display" class="font-bold text-lg ml-1">0</span></span>
                     <span id="calc_conversion_info" class="text-gray-400 italic text-[9px]"></span>
                 </div>
             </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-2">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 sticky top-0">
                    <tr>
                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Component</th>
                        <th class="px-3 py-2 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Qty Req.</th>
                        <th class="px-3 py-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                    </tr>
                </thead>
                <tbody id="bom_list_body" class="bg-white divide-y divide-gray-200">
                </tbody>
            </table>

            <div id="bom_empty_state" class="hidden py-8 text-center text-gray-400">
                <p>No components in this recipe yet.</p>
            </div>
        </div>

        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-lg text-right">
            <button onclick="closeBomModal()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 text-sm font-medium">Done</button>
        </div>
    </div>
</div>
