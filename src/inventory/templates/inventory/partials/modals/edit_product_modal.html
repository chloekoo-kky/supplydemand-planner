<div id="editProductModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
     onmousedown="this.dataset.readyToClose = 'true'"
     onclick="if(this.dataset.readyToClose === 'true') closeEditModal(); this.dataset.readyToClose = 'false'">

    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white"
         onmousedown="event.stopPropagation()"
         onclick="event.stopPropagation()">

        <div class="mt-3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-2">Edit Product</h3>
            <form id="editProductForm" class="text-left">
                <input type="hidden" id="edit_product_id" name="id">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700">SKU</label>
                    <input type="text" id="edit_sku" name="sku" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <input type="text" id="edit_desc" name="description" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <input type="hidden" id="edit_category" name="category">

                    <div class="flex flex-wrap gap-2" id="category-btn-container">
                        {% for cat in all_categories %}
                        <button type="button"
                                onclick="selectCategory('{{ cat }}', this)"
                                class="category-btn px-3 py-1 rounded-md text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-blue-300 hover:text-white-600 transition-all shadow-sm">
                            {{ cat }}
                        </button>
                        {% endfor %}

                        <button type="button"
                                onclick="toggleCustomCategory()"
                                class="px-3 py-1 rounded-md text-xs font-medium border border-dashed border-gray-300 text-gray-400 hover:border-blue-400 hover:text-blue-600 transition-all flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Custom
                        </button>
                    </div>

                    <input type="text"
                           id="edit_category_custom"
                           class="mt-3 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm text-sm hidden placeholder-gray-400 focus:border-blue-500 focus:ring-blue-500"
                           placeholder="Enter new category name..."
                           oninput="document.getElementById('edit_category').value = this.value">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700">Unit (UOM)</label>
                        <input type="text" id="edit_uom" name="uom" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                    <div class="mb-3">
                         <label class="block text-sm font-medium text-gray-700">Weight (kg)</label>
                         <input type="number" step="0.01" id="edit_weight" name="unit_weight" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>
                <div class="mb-3">
                     <label class="block text-sm font-medium text-gray-700">Volume (L)</label>
                     <input type="number" step="0.01" id="edit_volume" name="unit_volume" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                     <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700">Est. Daily Usage</label>
                        <input type="number" step="0.01" id="edit_usage" name="estimated_daily_usage" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                     <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700">Min Order Qty (MOQ)</label>
                        <input type="number" step="0.01" id="edit_moq" name="moq" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                     <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700">Safety Stock (Days)</label>
                        <input type="number" id="edit_safety" name="safety_stock_days" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                     <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700">Lead Time (Days)</label>
                        <input type="number" id="edit_lead" name="lead_time_days" class="mt-1 py-2 px-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>
                <div class="mt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md">Cancel</button>
                    <button type="button" onclick="submitEditForm()" class="px-4 py-2 bg-blue-600 text-white rounded-md">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
