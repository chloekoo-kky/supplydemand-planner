<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">Import Ingredients (BOM)</h3>
        <button type="button" onclick="closeBomImportModal()" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <form id="bomImportForm" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:bg-gray-50 transition-colors">
            <div class="space-y-2">
                <i class="fas fa-file-csv text-3xl text-gray-400"></i>
                <div class="text-sm text-gray-600">
                    <label for="file_upload_bom" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500">
                        <span>Upload a file</span>
                        <input id="file_upload_bom" name="file_upload" type="file" class="sr-only" accept=".csv, .xlsx" onchange="document.getElementById('bom_file_label').innerText = this.files[0].name">
                    </label>
                    <p class="pl-1">or drag and drop</p>
                </div>
                <p id="bom_file_label" class="text-xs text-gray-500">CSV or Excel files up to 10MB</p>
                <p class="text-xs text-gray-400">Required Columns: Parent SKU, Component SKU, Quantity</p>
            </div>
        </div>

        <div id="uploadStatus" class="hidden text-sm text-center py-2"></div>

        <div class="flex justify-end pt-4">
            <button type="button"
                    onclick="uploadBomFile()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm transition-colors flex items-center gap-2">
                <span>Continue</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>
    </form>
</div>


<script>
function uploadBomFile() {
    const form = document.getElementById('bomImportForm');
    const formData = new FormData(form);
    const statusDiv = document.getElementById('uploadStatus');

    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    statusDiv.classList.remove('hidden', 'text-red-500');
    statusDiv.classList.add('text-blue-500');

    fetch("{% url 'inventory:import_bom_process' %}", {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('modalContent').innerHTML = data.html;
        } else {
            statusDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.message}`;
            statusDiv.classList.replace('text-blue-500', 'text-red-500');
        }
    })
    .catch(err => {
        statusDiv.innerHTML = 'Network Error';
        statusDiv.classList.replace('text-blue-500', 'text-red-500');
    });
}
</script>
