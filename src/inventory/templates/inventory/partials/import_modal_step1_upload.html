<div class="p-6">
    <div class="mb-6 text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-indigo-100">
            <svg class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
        </div>
        <h3 class="mt-2 text-lg font-semibold text-gray-900">Upload Inventory Data</h3>
        <p class="mt-1 text-sm text-gray-500">
            Support .csv, .xlsx, or .pdf files.
        </p>
    </div>

    <div class="mb-6 rounded-lg bg-slate-50 p-4 border border-slate-200">
        <div class="flex items-start">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3 flex-1 md:flex md:justify-between">
                <p class="text-sm text-slate-700">
                    Not sure about the format? Use our standard template.
                </p>
                <p class="mt-3 text-sm md:ml-6 md:mt-0">
                    <a href="{% url 'inventory:import_template' %}" class="whitespace-nowrap font-medium text-indigo-700 hover:text-indigo-600">
                        Download Template <span aria-hidden="true">&rarr;</span>
                    </a>
                </p>
            </div>
        </div>
    </div>

    <form id="uploadForm"
          data-url="{% url 'inventory:import_process' %}"
          enctype="multipart/form-data"
          class="space-y-4">
        {% csrf_token %}

        <div class="relative rounded-lg border border-dashed border-gray-300 p-8 text-center hover:bg-slate-50 transition-colors">
            <input type="file" name="file_upload" id="file-upload"
                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                   accept=".csv, .xlsx, .xls, .pdf"
                   onchange="updateFileName(this)"
                   required>

            <div class="text-sm text-gray-600" id="upload-placeholder-text">
                <span class="font-semibold text-indigo-600">Click to upload</span> or drag and drop
            </div>
            <div id="file-name-display" class="text-sm font-bold text-indigo-600 hidden mt-2"></div>

            <p class="text-xs text-gray-500 mt-1">CSV, Excel or PDF up to 10MB</p>
        </div>

        <div id="uploadError" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700"></div>

        <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
            <button type="button"
                    id="uploadBtn"
                    onclick="submitUpload()"
                    class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:col-start-2">
                Next: Preview
            </button>
            <button type="button" onclick="closeImportModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0">
                Cancel
            </button>
        </div>
    </form>
</div>
