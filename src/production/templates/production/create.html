{% extends 'base.html' %}
{% block header %}New Production Order{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-sm border border-gray-100">
    <form method="POST">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">Finished Good (Recipe)</label>
                <select name="product_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-2 px-3 border">
                    <option value="">-- Select Product --</option>
                    {% for fg in fgs %}
                    <option value="{{ fg.id }}">{{ fg.sku }} - {{ fg.description }}</option>
                    {% endfor %}
                </select>
                <p class="mt-1 text-xs text-gray-500">Only showing products configured as 'Finished Goods'.</p>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Plan Quantity</label>
                    <input type="number" name="quantity" required min="1" step="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-2 px-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Planned Date</label>
                    <input type="date" name="start_date" value="{% now 'Y-m-d' %}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-2 px-3 border">
                </div>
            </div>

            <div class="flex justify-end pt-4">
                <a href="{% url 'production:dashboard' %}" class="mr-3 bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="bg-indigo-600 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-indigo-700">Create Plan</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
