<div class="flex flex-col h-[calc(100vh-140px)] bg-white rounded-lg shadow border border-slate-200 relative">

    <div id="calendar-loading" class="absolute inset-0 bg-white/50 z-40 hidden flex items-center justify-center backdrop-blur-[1px]">
        <div class="flex items-center space-x-2 text-blue-600">
            <svg class="animate-spin h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-sm font-medium">Updating Schedule...</span>
        </div>
    </div>

    <div class="px-6 py-3 border-b border-slate-100 flex flex-wrap gap-4 items-center bg-slate-50 rounded-t-lg">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Legend:</span>
        <div class="flex items-center text-xs text-slate-700">
            <span class="w-3 h-3 rounded-full bg-gray-400 mr-2"></span>Draft
        </div>
        <div class="flex items-center text-xs text-slate-700">
            <span class="w-3 h-3 rounded-full bg-blue-600 mr-2"></span>Confirmed
        </div>
        <div class="flex items-center text-xs text-slate-700">
            <span class="w-3 h-3 rounded-full bg-orange-600 mr-2"></span>In Progress
        </div>

        <div class="ml-auto">
             <a href="{% url 'production:dashboard' %}" class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                List View
            </a>
        </div>
    </div>

    <div class="flex-1 p-4 overflow-hidden relative z-0">
        <div id="calendar" class="h-full min-h-[400px]"></div>
    </div>
</div>

<div id="toast-container" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

{% include 'production/partials/edit_status_modal.html' %}

<script>
    // 状态映射辅助函数 (防止后端没传 status_raw)
    function mapDisplayStatusToCode(displayStatus) {
        if (!displayStatus) return 'DRAFT';
        const map = {
            'Draft': 'DRAFT',
            'Confirmed': 'CONFIRMED',
            'In Progress': 'IN_PROGRESS',
            'Completed': 'COMPLETED',
            'Cancelled': 'CANCELLED'
        };
        // 如果找不到映射，假设它已经是 Code (比如已经是 "CONFIRMED")
        return map[displayStatus] || displayStatus;
    }

    function initCalendar() {
        var calendarEl = document.getElementById('calendar');
        var loadingEl = document.getElementById('calendar-loading');

        if (!calendarEl) return;

        // 检查 FullCalendar 是否加载
        if (typeof FullCalendar === 'undefined') {
            console.error('FullCalendar library not loaded. Check base.html');
            return;
        }

        // 延迟初始化 (解决 AJAX 加载时的 DOM 尺寸问题)
        setTimeout(function() {
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,listWeek'
                },
                height: '100%',
                firstDay: 1,
                events: '{% url "production:api_events" %}',
                editable: true,
                dayMaxEvents: true,

                // === 1. 拖拽逻辑 ===
                eventDrop: function(info) {
                    const d = info.event.start;
                    // 使用本地时间获取日期，防止时区偏差
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const newDate = `${year}-${month}-${day}`;
                    const poNumber = info.event.extendedProps.po_number;

                    if (!confirm(`Move ${poNumber} to ${newDate}?`)) {
                        info.revert();
                        return;
                    }

                    loadingEl.classList.remove('hidden');

                    fetch('{% url "production:api_move_event" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            id: info.event.id,
                            new_date: newDate
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        loadingEl.classList.add('hidden');
                        if (data.status === 'ok') {
                            showToast(`Success: ${data.message}`, 'success');
                        } else {
                            showToast(`Error: ${data.message}`, 'error');
                            info.revert();
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        loadingEl.classList.add('hidden');
                        showToast("Network Error", 'error');
                        info.revert();
                    });
                },

                // === 2. 点击事件 (调用 Modal) ===
                eventClick: function(info) {
                    const props = info.event.extendedProps;

                    // 获取数据
                    const poNumber = props.po_number || 'Unknown PO';
                    // 优先用 status_raw，如果没有，尝试用 status 进行映射
                    let statusCode = props.status_raw;
                    if (!statusCode) {
                        statusCode = mapDisplayStatusToCode(props.status);
                    }

                    // 检查全局函数是否存在
                    if (typeof window.openEditStatusModal === 'function') {
                        window.openEditStatusModal(info.event.id, statusCode, poNumber);
                    } else {
                        console.error('openEditStatusModal function is missing. Check edit_status_modal.html include.');
                        alert('Error: Modal not loaded properly.');
                    }
                },

                // === 3. 自定义渲染 ===
                eventContent: function(arg) {
                    let title = arg.event.title;
                    let status = arg.event.extendedProps.status;
                    return {
                        html: `<div class="fc-content px-1 overflow-hidden flex flex-col justify-center h-full">
                                 <div class="font-bold text-xs truncate leading-tight">${title}</div>
                                 <div class="text-[9px] opacity-80 truncate uppercase tracking-tighter">${status}</div>
                               </div>`
                    }
                }
            });

            calendar.render();

            // 再次刷新尺寸，确保不留白
            setTimeout(function() {
                calendar.updateSize();
            }, 100);

        }, 50);
    }

    // Toast 提示工具
    function showToast(message, type='success') {
        const container = document.getElementById('toast-container');
        if(!container) return;
        const toast = document.createElement('div');
        const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';

        toast.className = `${bgClass} text-white px-4 py-3 rounded shadow-lg text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 flex items-center shadow-slate-400/50`;
        toast.innerHTML = `
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${type==='success'?'M5 13l4 4L19 7':'M6 18L18 6M6 6l12 12'}"></path></svg>
            ${message}
        `;
        container.appendChild(toast);
        requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
        setTimeout(() => {
            toast.classList.add('translate-y-2', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // 启动
    initCalendar();
</script>

<style>
    .fc-event {
        cursor: pointer;
        border: none !important;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        transition: transform 0.1s;
    }
    .fc-event:hover { transform: scale(1.02); z-index: 10; }
    .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 700 !important; color: #334155; }
    .fc-button-primary { background-color: #3b82f6 !important; border-color: #3b82f6 !important; font-size: 0.85rem !important; }
    .fc-button-active { background-color: #2563eb !important; border-color: #2563eb !important; }
    .fc-day-today { background-color: #eff6ff !important; }
</style>
